<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Projeto15-Site de música</title>
</head>
<body>
    <div class="container">
        <div class="barranav">
            <img src="img/logo.png" class="logo">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Sobre</a></li>
                    <li><a href="#">Especificações</a></li>
                    <li><a href="#">Produtos</a></li>
                    <li><a href="#">Conexão</a></li>
                </ul>
        </div>
        <div class="conteudo">
            <div class="escoluna">
                <h1>O <br>SOM <br>VERDADEIRO</h1>
            </div>
            <div class="dircoluna">
                <p>Clique Aqui Para Ouvir</p>
                <img src="img/play.png" id="icone">
            </div>
        </div>
    </div>

    <audio id="meusom">
        <source src="img/som.mp3" type="audio/mp3">
    </audio>

    <script>
        var meusom = document.getElementById("meusom");
        var icone = document.getElementById("icone");

        icone.onclick = function() {
            if (meusom.paused) {
                meusom.play();
                icone.src = "img/pause.png";
            } else {
                meusom.pause();
                icone.src = "img/play.png";
            }
        }
    </script>
</body>
</html>
